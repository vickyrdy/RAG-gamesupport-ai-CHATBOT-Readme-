services:
  api:
    image: gamesupport-ai:latest
    container_name: gamesupport-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CHAT_DB_PATH: /app/data/chat.sqlite
    volumes:
      - qdrant_data:/app/.qdrant
      - chat_data:/app/data
    restart: unless-stopped

volumes:
  qdrant_data:
  chat_data:
