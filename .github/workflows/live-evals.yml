name: Live RAG Evaluations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-rag-evaluations
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check API key configuration
        shell: bash
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "deepeval==2.9.3"

      - name: Index support documents
        run: python -m app.ingest

      - name: Run faithfulness and relevancy evaluations
        run: python -m evaluation.run_evals

      - name: Run multi-turn evaluation
        if: ${{ !cancelled() }}
        run: python -m evaluation.run_multiturn_evals

      - name: Run direct-attack red-team evaluation
        if: ${{ !cancelled() }}
        run: python -m evaluation.run_redteam

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-evaluation-results
          if-no-files-found: warn
          path: |
            evaluation/results.json
            evaluation/multiturn_results.json
            evaluation/redteam_results.json
